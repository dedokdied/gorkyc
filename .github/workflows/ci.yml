name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assistant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/assistant
      BOT_INTERNAL_SECRET: ci-secret
      LLM_PROVIDER: rule-based
      REMINDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "./project/backend[dev]"
      - name: Check migrations
        working-directory: project/backend
        run: alembic upgrade head
      - name: Lint backend
        working-directory: project/backend
        run: ruff check app tests
      - name: Test backend
        working-directory: project/backend
        run: pytest -q

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/telegram_bot/pyproject.toml
      - name: Install bot
        run: |
          python -m pip install --upgrade pip
          pip install -e "./project/telegram_bot[dev]"
      - name: Lint bot
        working-directory: project/telegram_bot
        run: ruff check app tests
      - name: Test bot
        working-directory: project/telegram_bot
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json
      - name: Install frontend
        working-directory: project/frontend
        run: npm ci
      - name: Build frontend
        working-directory: project/frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assistant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/assistant
      BOT_INTERNAL_SECRET: ci-secret
      LLM_PROVIDER: rule-based
      REMINDERS_ENABLED: "false"
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "./project/backend[dev]"
      - name: Check migrations
        working-directory: project/backend
        run: alembic upgrade head
      - name: Start API
        working-directory: project/backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/healthz; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json
      - name: Install frontend
        working-directory: project/frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: project/frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser e2e
        working-directory: project/frontend
        run: npm run e2e
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/api.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            project/frontend/playwright-report
            project/frontend/test-results
          if-no-files-found: ignore
