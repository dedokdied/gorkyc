[project]
name = "assistant-telegram-bot"
version = "0.1.0"
description = "Telegram MVP client for the voice assistant"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
